<div class="fixed inset-0 z-50 bg-slate-900 flex flex-col h-screen w-screen overflow-hidden">

  <!-- HEADER DE LA SALA -->
  <div class="h-16 bg-slate-800/80 backdrop-blur-md flex justify-between items-center px-6 border-b border-slate-700 shrink-0">

    <div class="flex items-center gap-3 text-white">
      <div class="w-8 h-8 rounded-full bg-teal-500 flex items-center justify-center animate-pulse">
        <fa-icon [icon]="icons.video"></fa-icon>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide">CONSULTORIO VIRTUAL</h1>
        <p class="text-[10px] text-slate-400">Conexión segura cifrada</p>
      </div>
    </div>

    <button (click)="salir()" class="bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 border border-red-500/50">
      <fa-icon [icon]="icons.volver"></fa-icon> Salir de la sala
    </button>
  </div>

  <!-- CONTENEDOR DEL VIDEO -->
  <div class="flex-1 relative bg-black">

    <!-- Spinner de carga -->
    @if (loading()) {
      <div class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 z-0">
        <fa-icon [icon]="icons.loading" class="text-4xl animate-spin mb-4"></fa-icon>
        <p class="text-sm font-mono animate-pulse">Estableciendo conexión segura...</p>
      </div>
    }

    <!-- Aquí Jitsi inyectará el Iframe -->
    <div id="jitsi-container" class="w-full h-full z-10 relative"></div>

  </div>

</div>
