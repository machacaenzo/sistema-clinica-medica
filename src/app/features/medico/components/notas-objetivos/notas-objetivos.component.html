<form [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-col gap-4">

  <!-- 1. NOTAS ADHESIVAS (CONTEXTO SOCIAL) -->
  <div class="bg-yellow-50/80 border border-yellow-200 rounded-xl p-3 shadow-sm relative group transition-all hover:shadow-md">

    <!-- Decoración chincheta/pin -->
    <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-8 h-2 bg-yellow-200/50 rounded-full blur-[1px]"></div>
    <div class="absolute -top-1.5 left-1/2 -translate-x-1/2 w-3 h-3 rounded-full bg-red-400 shadow-sm border border-red-500 z-10"></div>

    <div class="flex items-center gap-2 mb-2 text-yellow-800 opacity-70">
      <fa-icon [icon]="icons.nota" class="text-xs"></fa-icon>
      <span class="text-[10px] font-black uppercase tracking-widest">Contexto / Notas Personales</span>
    </div>

    <textarea formControlName="nota"
              class="w-full bg-transparent border-none outline-none text-xs text-yellow-900 font-medium resize-none placeholder-yellow-700/40 leading-relaxed"
              rows="4"
              placeholder="Ej: Cuidador principal de su esposa. Dificultad para comprar medicación..."></textarea>
  </div>

  <!-- 2. METAS TERAPÉUTICAS (GAMIFICATION) -->
  <div class="bg-white/40 border border-white/60 rounded-xl p-4 shadow-sm backdrop-blur-sm">

    <div class="flex justify-between items-center mb-3">
      <h4 class="text-[10px] font-black text-slate-500 uppercase tracking-widest flex items-center gap-2">
        <fa-icon [icon]="icons.meta" class="text-teal-500"></fa-icon> Objetivos Terapéuticos
      </h4>
      <!-- Botón Guardar Mini -->
      <button type="submit" [disabled]="guardando || form.pristine"
              class="text-[10px] bg-teal-600 text-white px-3 py-1 rounded-lg font-bold shadow-md hover:bg-teal-700 transition-all disabled:opacity-0 disabled:translate-y-2">
        <fa-icon [icon]="icons.save"></fa-icon> Guardar
      </button>
    </div>

    <div class="space-y-2">

      <!-- Meta Peso -->
      <div class="flex items-center gap-2 bg-white/50 p-1.5 rounded-lg border border-slate-100 focus-within:border-teal-300 focus-within:ring-2 focus-within:ring-teal-100 transition-all">
        <div class="w-6 h-6 rounded flex items-center justify-center bg-teal-50 text-teal-600 text-xs">
          <fa-icon [icon]="icons.peso"></fa-icon>
        </div>
        <span class="text-[10px] font-bold text-slate-500 uppercase w-16">Peso</span>
        <input type="number" formControlName="metaPeso" class="bg-transparent border-none outline-none text-xs font-bold text-slate-700 w-full text-right" placeholder="-">
        <span class="text-[10px] text-slate-400 w-6">kg</span>
      </div>

      <!-- Meta Presión -->
      <div class="flex items-center gap-2 bg-white/50 p-1.5 rounded-lg border border-slate-100 focus-within:border-rose-300 focus-within:ring-2 focus-within:ring-rose-100 transition-all">
        <div class="w-6 h-6 rounded flex items-center justify-center bg-rose-50 text-rose-600 text-xs">
          <fa-icon [icon]="icons.presion"></fa-icon>
        </div>
        <span class="text-[10px] font-bold text-slate-500 uppercase w-16">P. Art.</span>
        <input type="number" formControlName="metaPresion" class="bg-transparent border-none outline-none text-xs font-bold text-slate-700 w-full text-right" placeholder="-">
        <span class="text-[10px] text-slate-400 w-6">mm</span>
      </div>

      <!-- Meta HbA1c -->
      <div class="flex items-center gap-2 bg-white/50 p-1.5 rounded-lg border border-slate-100 focus-within:border-purple-300 focus-within:ring-2 focus-within:ring-purple-100 transition-all">
        <div class="w-6 h-6 rounded flex items-center justify-center bg-purple-50 text-purple-600 text-xs">
          <fa-icon [icon]="icons.lab"></fa-icon>
        </div>
        <span class="text-[10px] font-bold text-slate-500 uppercase w-16">HbA1c</span>
        <input type="number" formControlName="metaHba1c" class="bg-transparent border-none outline-none text-xs font-bold text-slate-700 w-full text-right" placeholder="-">
        <span class="text-[10px] text-slate-400 w-6">%</span>
      </div>

    </div>
  </div>

</form>
