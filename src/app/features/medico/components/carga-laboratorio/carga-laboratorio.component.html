<div class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">

  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden border border-slate-200 flex flex-col max-h-[90vh]">

    <!-- HEADER -->
    <div class="bg-indigo-50 px-6 py-4 border-b border-indigo-100 flex justify-between items-center shrink-0">
      <div>
        <h3 class="font-black text-slate-800 flex items-center gap-2 text-lg">
          <fa-icon [icon]="icons.lab" class="text-indigo-600"></fa-icon> Transcripción de Laboratorio
        </h3>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">
          Ingrese manualmente valores de estudios externos
        </p>
      </div>
      <button (click)="cancelar.emit()" class="text-slate-400 hover:text-slate-600 transition-colors">
        <fa-icon [icon]="icons.close" class="text-xl"></fa-icon>
      </button>
    </div>

    <!-- BODY -->
    <div class="p-8 bg-slate-50/50 overflow-y-auto custom-scrollbar flex-1">
      <form [formGroup]="form" class="space-y-8">

        <!-- 1. METABÓLICO -->
        <div class="animate-fade-in">
            <h4 class="text-xs font-black text-orange-500 uppercase tracking-widest mb-4 border-b border-orange-200 pb-1">Metabolismo / Diabetes</h4>
            <div class="grid grid-cols-2 gap-6">
              <div>
                <label class="label-mini">Glucemia</label>
                <div class="relative">
                   <input type="number" formControlName="glucemia" class="input-field pl-3 font-bold border-orange-200 text-orange-800" placeholder="---">
                   <span class="unit-badge">mg/dL</span>
                </div>
              </div>
              <div>
                <label class="label-mini">HbA1c</label>
                <div class="relative">
                   <input type="number" formControlName="hba1c" class="input-field pl-3 border-orange-200 text-orange-800" placeholder="---">
                   <span class="unit-badge">%</span>
                </div>
              </div>
            </div>
        </div>

        <!-- 2. LÍPIDOS -->
        <div class="animate-fade-in">
            <h4 class="text-xs font-black text-teal-600 uppercase tracking-widest mb-4 border-b border-teal-200 pb-1">Perfil Lipídico</h4>
            <div class="grid grid-cols-2 gap-6">
              <div>
                <label class="label-mini">Colesterol Total</label>
                <div class="relative">
                   <input type="number" formControlName="colesterol" class="input-field pl-3" placeholder="---">
                   <span class="unit-badge">mg/dL</span>
                </div>
              </div>
              <div>
                <label class="label-mini">HDL (Bueno)</label>
                <div class="relative">
                   <input type="number" formControlName="hdl" class="input-field pl-3" placeholder="---">
                   <span class="unit-badge">mg/dL</span>
                </div>
              </div>
              <div>
                <label class="label-mini">LDL (Malo)</label>
                <div class="relative">
                   <input type="number" formControlName="ldl" class="input-field pl-3" placeholder="---">
                   <span class="unit-badge">mg/dL</span>
                </div>
              </div>
              <div>
                <label class="label-mini">Triglicéridos</label>
                <div class="relative">
                   <input type="number" formControlName="trigliceridos" class="input-field pl-3" placeholder="---">
                   <span class="unit-badge">mg/dL</span>
                </div>
              </div>
            </div>
        </div>

        <!-- 3. RENAL -->
        <div class="animate-fade-in">
            <h4 class="text-xs font-black text-blue-500 uppercase tracking-widest mb-4 border-b border-blue-200 pb-1">Función Renal</h4>
            <div class="grid grid-cols-2 gap-6">
              <div>
                <label class="label-mini">Creatinina</label>
                <div class="relative">
                   <input type="number" formControlName="creatinina" class="input-field pl-3 border-blue-200 text-blue-800" placeholder="---">
                   <span class="unit-badge">mg/dL</span>
                </div>
              </div>
              <div>
                <label class="label-mini">Urea</label>
                <div class="relative">
                   <input type="number" formControlName="urea" class="input-field pl-3 border-blue-200 text-blue-800" placeholder="---">
                   <span class="unit-badge">mg/dL</span>
                </div>
              </div>
            </div>
        </div>

        <!-- 4. OBSERVACIONES -->
        <div>
           <label class="label-mini">Notas Adicionales / Origen</label>
           <textarea formControlName="observaciones" rows="2" class="input-field resize-none" placeholder="Ej: Estudio traído del Hospital Central..."></textarea>
        </div>

      </form>
    </div>

    <!-- FOOTER -->
    <div class="p-6 bg-white border-t border-slate-100 flex justify-end gap-3 shrink-0">
      <button (click)="cancelar.emit()" class="text-slate-500 font-bold text-xs px-6 py-3 hover:bg-slate-100 rounded-xl transition-colors">Cancelar</button>
      <button (click)="confirmar()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-black uppercase tracking-widest shadow-lg shadow-indigo-500/30 transition-all flex items-center gap-2 active:scale-95 text-xs">
        <fa-icon [icon]="icons.check"></fa-icon> Importar Datos
      </button>
    </div>

  </div>
</div>
