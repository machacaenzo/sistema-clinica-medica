<div class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-fade-in">

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden border border-slate-200">

    <!-- Header -->
    <div class="bg-slate-50 px-5 py-4 border-b border-slate-100 flex justify-between items-center">
      <h3 class="font-black text-slate-800 flex items-center gap-2">
        <fa-icon [icon]="icons.rinon" class="text-blue-500"></fa-icon> Calculadora Renal
      </h3>
      <button (click)="cerrar.emit()" class="text-slate-400 hover:text-slate-600"><fa-icon [icon]="icons.close"></fa-icon></button>
    </div>

    <div class="p-6">
      <div class="text-xs text-slate-500 mb-4 flex gap-2">
        <span class="bg-slate-100 px-2 py-1 rounded">Edad: {{ datosBase.edad }}</span>
        <span class="bg-slate-100 px-2 py-1 rounded">Sexo: {{ datosBase.sexo }}</span>
      </div>

      <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Creatinina Sérica (mg/dL)</label>
      <div class="flex gap-2 mb-4">
        <input type="number" [ngModel]="creatinina()" (ngModelChange)="creatinina.set($event)" (keydown.enter)="calcular()"
               class="w-full border-2 border-slate-200 rounded-xl px-4 py-2 font-bold text-slate-800 text-lg outline-none focus:border-blue-400 text-center"
               placeholder="Ej: 0.9" autofocus>
        <button (click)="calcular()" [disabled]="!creatinina()" class="bg-slate-800 text-white px-4 rounded-xl font-bold text-xs hover:bg-black disabled:opacity-50">Calcular</button>
      </div>

      @if (resultado()) {
        <div class="animate-slide-up bg-slate-50 rounded-xl p-4 border border-slate-100 text-center">
          <p class="text-xs text-slate-500 font-bold uppercase mb-1">Filtrado Glomerular (TFG)</p>
          <div class="text-3xl font-black text-slate-800 leading-none mb-2">{{ resultado()?.valor }}</div>
          <div class="inline-block px-3 py-1 rounded-lg text-[10px] font-black mb-2 uppercase" [ngClass]="resultado()?.color">
            {{ resultado()?.estadio }}
          </div>
          <p class="text-xs text-slate-600 italic leading-tight">{{ resultado()?.mensaje }}</p>

          <button (click)="confirmar()" class="w-full mt-4 bg-teal-600 hover:bg-teal-700 text-white py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-teal-500/20 active:scale-95">
            <fa-icon [icon]="icons.check"></fa-icon> Insertar en Diagnóstico
          </button>
        </div>
      }
    </div>
  </div>
</div>
