<main class="auth-page-wrapper">

  <!-- AGREGADO 'relative' -->
  <div class="auth-container relative">

    <!-- 1. BOTÓN CERRAR -->
    <a routerLink="/public/home"
       class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors p-2 rounded-full hover:bg-slate-100"
       title="Volver al inicio">
      <fa-icon [icon]="faTimes" class="text-xl"></fa-icon>
    </a>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">

      <div class="auth-header">
        <h1>Recuperar Contraseña</h1>
        <p>Ingresa tu correo y te enviaremos un enlace de recuperación.</p>
      </div>

      <div class="input-group">
        <fa-icon [icon]="faEnvelope" class="input-icon"></fa-icon>
        <input type="email" class="input-field input-field--icon" placeholder="Correo Electrónico" formControlName="email">
      </div>

      <!-- Mensajes de error (si los tenías) -->
      <ng-container *ngIf="email?.invalid && (email?.touched || email?.dirty)">
         <!-- ... tu lógica de error ... -->
      </ng-container>

      <button class="btn--primary mt-8" type="submit" [disabled]="isSubmitting()">
        <ng-container *ngIf="isSubmitting()">
           <!-- Spinner opcional -->
           <span>Enviando...</span>
        </ng-container>
        <ng-container *ngIf="!isSubmitting()">
           <span>Enviar Enlace</span>
        </ng-container>
      </button>

      <!-- 2. LINK CORREGIDO -->
      <p class="auth-link">
        ¿Recordaste tu contraseña? <a routerLink="/auth/login">Volver a Iniciar Sesión</a>
      </p>

    </form>
  </div>
</main>
