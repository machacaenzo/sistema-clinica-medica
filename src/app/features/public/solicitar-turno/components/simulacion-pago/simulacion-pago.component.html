<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm animate-fade-in">

  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden relative">

    <!-- HEADER / TARJETA VISUAL -->
    <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-6 text-white relative overflow-hidden h-48 flex flex-col justify-between">
      <!-- Decoración de fondo -->
      <div class="absolute top-0 right-0 w-40 h-40 bg-white/5 rounded-full -translate-y-1/2 translate-x-1/2 blur-2xl"></div>

      <div class="flex justify-between items-start z-10">
        <span class="font-bold tracking-widest text-sm opacity-80">BANK</span>
        <fa-icon [icon]="icons.faCreditCard" class="text-2xl opacity-80"></fa-icon>
      </div>

      <!-- Chip simulado -->
      <div class="w-10 h-8 bg-yellow-500/80 rounded-md border border-yellow-300/50 relative overflow-hidden">
        <div class="absolute top-1/2 w-full h-[1px] bg-black/20"></div>
        <div class="absolute left-1/2 h-full w-[1px] bg-black/20"></div>
      </div>

      <div class="z-10">
        <p class="font-mono text-xl tracking-widest mb-2 shadow-black drop-shadow-md">
          {{ pagoForm.get('numero')?.value || '•••• •••• •••• ••••' }}
        </p>
        <div class="flex justify-between text-xs opacity-80 uppercase">
          <span>{{ pagoForm.get('nombre')?.value || 'NOMBRE TITULAR' }}</span>
          <span>{{ pagoForm.get('vencimiento')?.value || 'MM/YY' }}</span>
        </div>
      </div>
    </div>

    <!-- CUERPO DEL FORMULARIO -->
    <div class="p-6">

      <!-- ESTADO: PROCESANDO -->
      @if (procesando()) {
        <div class="flex flex-col items-center justify-center py-10 space-y-4">
          <div class="w-12 h-12 border-4 border-teal-100 border-t-teal-500 rounded-full animate-spin"></div>
          <p class="text-slate-500 font-bold animate-pulse">Procesando pago...</p>
        </div>
      }

      <!-- ESTADO: ÉXITO -->
      @else if (exito()) {
        <div class="flex flex-col items-center justify-center py-10 space-y-4 animate-bounce-in">
          <fa-icon [icon]="icons.faCheckCircle" class="text-6xl text-green-500"></fa-icon>
          <p class="text-green-600 font-black text-xl">¡Pago Aprobado!</p>
        </div>
      }

      <!-- ESTADO: FORMULARIO -->
      @else {
        <div class="flex justify-between items-center mb-6">
          <h3 class="font-bold text-slate-700">Total a pagar</h3>
          <span class="text-2xl font-black text-teal-600">${{ monto }}</span>
        </div>

        <form [formGroup]="pagoForm" (ngSubmit)="pagar()" class="flex flex-col gap-4">

          <!-- Número -->
          <div>
            <input type="text" formControlName="numero" maxlength="16" placeholder="Número de tarjeta"
                   class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-teal-400 outline-none transition-all placeholder:font-normal">
          </div>

          <!-- Nombre -->
          <div>
            <input type="text" formControlName="nombre" placeholder="Nombre como figura en la tarjeta"
                   class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-teal-400 outline-none uppercase placeholder:normal-case placeholder:font-normal">
          </div>

          <!-- Vencimiento y CVV -->
          <div class="grid grid-cols-2 gap-4">
            <input type="text" formControlName="vencimiento" placeholder="MM/YY" maxlength="5"
                   class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-teal-400 outline-none text-center">

            <div class="relative">
              <input type="password" formControlName="cvv" placeholder="CVV" maxlength="4"
                     class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-teal-400 outline-none text-center">
              <fa-icon [icon]="icons.faLock" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></fa-icon>
            </div>
          </div>

          <!-- Botones -->
          <div class="grid grid-cols-2 gap-3 mt-4">
            <button type="button" (click)="cerrar()" class="py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-100 transition-colors">
              Cancelar
            </button>
            <button type="submit" [disabled]="pagoForm.invalid"
                    class="bg-teal-600 hover:bg-teal-700 text-white py-3 rounded-xl font-bold shadow-lg shadow-teal-500/30 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
              Pagar Ahora
            </button>
          </div>
        </form>
      }

    </div>
  </div>
</div>
